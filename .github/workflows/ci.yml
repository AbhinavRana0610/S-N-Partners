# Checks every push and pull request, then deploys to Vercel once the checks pass:
#   pull request  -> preview deployment (URL posted in the job summary)
#   push to main  -> production deployment
#
# Deploys need the VERCEL_TOKEN repository secret (Settings -> Secrets and variables -> Actions).
# Until it is set, the checks still run and the deploy jobs are skipped. The Vercel team and
# project IDs below are identifiers, not credentials (they match .vercel/project.json).

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  deploy-preview:
    name: Deploy preview
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    env:
      RAW_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_GldmwmjV4MPr63meUmkINtPv
      VERCEL_PROJECT_ID: prj_SUeQOQiqOHzj7nOHz9VVTAiLJbA5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check Vercel secrets
        id: secrets
        run: |
          if [ -z "$RAW_VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN is not set; skipping the preview deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Strip stray whitespace or quotes picked up when pasting the token.
          clean() { printf "%s" "$1" | tr -d "[:space:]\"'"; }
          token=$(clean "$RAW_VERCEL_TOKEN")
          echo "::add-mask::$token"
          echo "VERCEL_TOKEN=$token" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - if: steps.secrets.outputs.ready == 'true'
        run: npm install --global vercel@latest
      - if: steps.secrets.outputs.ready == 'true'
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - if: steps.secrets.outputs.ready == 'true'
        run: vercel build --token="$VERCEL_TOKEN"
      - if: steps.secrets.outputs.ready == 'true'
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy production
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      RAW_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_GldmwmjV4MPr63meUmkINtPv
      VERCEL_PROJECT_ID: prj_SUeQOQiqOHzj7nOHz9VVTAiLJbA5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check Vercel secrets
        id: secrets
        run: |
          if [ -z "$RAW_VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN is not set; skipping the production deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Strip stray whitespace or quotes picked up when pasting the token.
          clean() { printf "%s" "$1" | tr -d "[:space:]\"'"; }
          token=$(clean "$RAW_VERCEL_TOKEN")
          echo "::add-mask::$token"
          echo "VERCEL_TOKEN=$token" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - if: steps.secrets.outputs.ready == 'true'
        run: npm install --global vercel@latest
      - if: steps.secrets.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - if: steps.secrets.outputs.ready == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - if: steps.secrets.outputs.ready == 'true'
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Production: $url" >> "$GITHUB_STEP_SUMMARY"
